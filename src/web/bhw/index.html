<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHW Field Console - AeDispatch</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="./bhw.css">
  <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">
</head>
<body class="bhw-app">
  <aside class="bhw-sidebar" id="sidebar">
    <div class="bhw-brand-row">
      <div class="bhw-brand">
        <img src="../shared/logo.svg" alt="AeDispatch" width="28" height="28">
        <div>
          <strong>AeDispatch</strong>
          <span>BHW Field Console</span>
        </div>
      </div>
      <button class="bhw-collapse-btn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/>
          <line x1="5.5" y1="2.5" x2="5.5" y2="13.5" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
    </div>

    <div class="bhw-nav-label">Menu</div>
    <nav class="bhw-nav-list">
      <a href="#/" class="bhw-nav-link active" id="nav-home">
        <span class="bhw-nav-left">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.5 6.8L8 2.3L13.5 6.8V13.2C13.5 13.6 13.2 14 12.7 14H3.3C2.8 14 2.5 13.6 2.5 13.2V6.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <span>Home</span>
        </span>
      </a>
      <a href="#/survey" class="bhw-nav-link" id="nav-survey">
        <span class="bhw-nav-left">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="3" y="2" width="10" height="12" rx="1.8" stroke="currentColor" stroke-width="1.4"/>
            <line x1="5.5" y1="5.5" x2="10.5" y2="5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="5.5" y1="8" x2="10.5" y2="8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="5.5" y1="10.5" x2="8.5" y2="10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Survey</span>
        </span>
      </a>
      <a href="#/forms" class="bhw-nav-link" id="nav-forms">
        <span class="bhw-nav-left">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2.2 4.2C2.2 3.5 2.7 3 3.4 3H6.2L7.6 4.5H12.6C13.3 4.5 13.8 5 13.8 5.7V11.8C13.8 12.5 13.3 13 12.6 13H3.4C2.7 13 2.2 12.5 2.2 11.8V4.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          <span>My forms</span>
        </span>
      </a>
    </nav>

    <div class="bhw-nav-label">General</div>
    <button id="sync-btn" class="bhw-nav-link bhw-sync-btn" type="button">
      <span class="bhw-nav-left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13.2 7.2A5.3 5.3 0 0 0 3.6 4.8M2.8 2.8V5.2H5.2M2.8 8.8A5.3 5.3 0 0 0 12.4 11.2M13.2 13.2V10.8H10.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Synchronize</span>
      </span>
      <span id="sync-badge" class="bhw-sync-pill" role="status">0</span>
    </button>

    <div class="bhw-user-card">
      <div class="bhw-avatar" id="user-avatar">BP</div>
      <div class="bhw-user-info">
        <strong id="user-brgy">Barangay Peñafrancia</strong>
        <span>Barangay account</span>
      </div>
    </div>
  </aside>

  <nav class="bhw-bottom-nav" aria-label="Mobile Navigation">
    <a href="#/" id="mob-nav-home" class="active">Home</a>
    <a href="#/survey" id="mob-nav-survey">Survey</a>
    <a href="#/forms" id="mob-nav-forms">My forms</a>
    <button id="mob-sync-btn" type="button">Sync <span id="mob-sync-badge"></span></button>
  </nav>

  <main id="app-root" class="bhw-main"></main>

  <script type="module" src="./index.js"></script>
</body>
</html>
