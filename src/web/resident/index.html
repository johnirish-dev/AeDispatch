<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AeDispatch - Resident</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 16px;">
    <div>
      <span style="font-size: 12px; color: var(--muted);">Your location</span>
      <select style="display: block; border: none; background: transparent; font-weight: 600; font-size: 16px; outline: none; margin-left: -4px;">
        <option>Peñafrancia</option>
        <option>Tagas</option>
      </select>
    </div>
    <button aria-label="Alerts" style="background: none; border: none; cursor: pointer; position: relative;">
      <!-- Inline SVG for Bell -->
      <svg width="24" height="24" fill="none" stroke="var(--ink)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span style="position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: var(--error); border-radius: 50%;"></span>
    </button>
  </header>

  <main>
    <!-- Hero Risk Card -->
    <section class="card" style="background-color: var(--accent-tint); border-color: var(--accent);">
      <div class="badge elevated" style="margin-bottom: 12px;">Elevated risk</div>
      <h1 style="margin: 0 0 16px 0; font-size: 22px; line-height: 1.2;">Conditions favor mosquito hatching through Sunday.</h1>
      
      <!-- 4-step risk bar -->
      <div style="display: flex; gap: 4px; margin-bottom: 16px;">
        <div style="height: 6px; flex: 1; background: var(--low-fill); border-radius: 4px;"></div>
        <div style="height: 6px; flex: 1; background: var(--mod-fill); border-radius: 4px;"></div>
        <div style="height: 6px; flex: 1; background: var(--elev-fill); border-radius: 4px;"></div>
        <div style="height: 6px; flex: 1; background: var(--line); border-radius: 4px;"></div>
      </div>
      
      <button class="btn-link">Why and what to do ›</button>
    </section>

    <!-- Daily Question Card -->
    <section class="card">
      <h2 style="font-size: 16px; margin-top: 0;">Daily Check-in</h2>
      <p style="color: var(--muted); font-size: 14px; margin-bottom: 16px;">Have you noticed more daytime mosquitoes than usual?</p>
      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
        <button class="btn-primary" id="btn-yes">Yes</button>
        <button class="btn-secondary" id="btn-no">No</button>
      </div>
      <div style="text-align: center;">
        <button class="btn-link" style="font-size: 12px; color: var(--muted);">Skip for now</button>
      </div>
    </section>
  </main>

  <!-- Bottom Tabs -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      Home
    </a>
    <a href="check.html" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      Check
    </a>
    <a href="learn.html" class="nav-item">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      Learn
    </a>
  </nav>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
